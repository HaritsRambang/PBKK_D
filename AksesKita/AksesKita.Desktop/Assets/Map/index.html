<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>AksesKita Map — Surabaya</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map { height: 100%; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        .pop { min-width: 230px; }
        .pop .tk { font-size: 11px; font-weight: 700; color: #0369A1; }
        .pop .tt { font-size: 14px; font-weight: 700; color: #0F172A; margin: 2px 0 4px; }
        .pop .ad { font-size: 12px; color: #475569; margin-bottom: 8px; }
        .pop .meta { font-size: 11.5px; color: #475569; margin-bottom: 10px; }
        .pop button { width: 100%; border: 0; border-radius: 8px; padding: 8px 10px; font-weight: 600; cursor: pointer; font-size: 12.5px; }
        .pop .primary { background: #0F2A43; color: #fff; margin-bottom: 6px; }
        .pop .ghost { background: #EEF2F7; color: #0F172A; }
        .legend { background: #fff; padding: 10px 14px; border-radius: 12px; box-shadow: 0 2px 10px rgba(0,0,0,.2); font-size: 12px; line-height: 1.7; }
        .legend b { display: block; font-size: 11px; letter-spacing: .04em; color: #475569; margin-bottom: 2px; }
        .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 7px; vertical-align: -1px; }
        .badge { position: absolute; z-index: 1000; top: 12px; left: 56px; background: #fff; border-radius: 22px; padding: 8px 16px; font-size: 13px; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
        .badge i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #DC2626; margin-right: 8px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="badge"><i></i>Mode Live GIS: Surabaya &amp; Sekitarnya</div>
    <script>
        // Centre of Surabaya.
        var map = L.map('map').setView([-7.2575, 112.7521], 12);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        var layer = L.layerGroup().addTo(map);
        var markers = {};

        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function dot(color) {
            return L.divIcon({
                className: '',
                html: '<div style="width:18px;height:18px;border-radius:50%;background:' + color +
                      ';border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)"></div>',
                iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -10]
            });
        }

        function post(type, id) {
            if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(type + ':' + id);
        }

        function popup(p) {
            return '<div class="pop">' +
                '<div class="tk">' + esc(p.ticket) + ' · ' + esc(p.category) + '</div>' +
                '<div class="tt">' + esc(p.title) + '</div>' +
                '<div class="ad">📍 ' + esc(p.address) + '</div>' +
                '<div class="meta">Tingkat: <b>' + esc(p.severity) + '</b> · Status: <b>' + esc(p.status) +
                '</b> · 👍 ' + esc(p.support) + ' dukungan</div>' +
                '<button class="primary" onclick="post(\'nav\',' + p.id + ')">Navigasi Rute Ramah Difabel</button>' +
                '<button class="ghost" onclick="post(\'open\',' + p.id + ')">Lihat Detail Lengkap</button>' +
                '</div>';
        }

        // Called from the WPF host with the filtered reports.
        function setPoints(arr) {
            layer.clearLayers();
            markers = {};
            arr.forEach(function (p) {
                var m = L.marker([p.lat, p.lng], { icon: dot(p.color) }).bindPopup(popup(p), { minWidth: 240 });
                m.addTo(layer);
                markers[p.id] = m;
            });
        }

        // Called from the WPF host when a report is picked in the sidebar.
        function focusPoint(id) {
            var m = markers[id];
            if (!m) return;
            map.flyTo(m.getLatLng(), 16, { duration: 0.8 });
            setTimeout(function () { m.openPopup(); }, 850);
        }

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function () {
            var d = L.DomUtil.create('div', 'legend');
            d.innerHTML = '<b>LEGENDA PETA AKSESIBILITAS</b>' +
                '<i style="background:#DC2626"></i>Kritis / Bahaya<br>' +
                '<i style="background:#D97706"></i>Menunggu Tinjauan<br>' +
                '<i style="background:#0E7490"></i>Sedang Perbaikan<br>' +
                '<i style="background:#16A34A"></i>Telah Diperbaiki';
            return d;
        };
        legend.addTo(map);
    </script>
</body>
</html>
